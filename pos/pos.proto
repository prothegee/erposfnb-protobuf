syntax = "proto3";

package erposfnb.pos;

import "common/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/prothegee/erposfnb-protobuf/pos";

// OrderType is how a customer takes the order.
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_DINE_IN = 1;
  ORDER_TYPE_TAKE_AWAY = 2;
  ORDER_TYPE_ONLINE_ORDER = 3;
}

// OrderStatus is the kitchen progress of one order.
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PROCESSING = 2;
  ORDER_STATUS_READY = 3;
  ORDER_STATUS_COMPLETED = 4;
}

// PaymentStatus is the settlement state of one order payment.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_DECLINED = 2;
  PAYMENT_STATUS_PAID = 3;
}

// PaymentMethod is how the customer settles the order.
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CASH = 1;
  PAYMENT_METHOD_DEBIT = 2;
  PAYMENT_METHOD_CREDIT = 3;
  PAYMENT_METHOD_QR = 4;
}

// Stock is a stock row of one tenant branch.
// quantity counts whole units, weight is the size of one unit.
// Total on hand in weight_unit is quantity x weight - weight_deduct.
message Stock {
  string id = 1;
  string tenant_id = 2;
  string tenant_id_branch = 3;
  string name = 4;
  int64 quantity = 5;
  int64 quantity_warning = 6;
  string thumbnail = 7;
  string description = 8;
  string category = 9;
  repeated string tags = 10;
  bool out_of_stock = 11;
  string extra_info = 12;
  double weight = 13;
  double weight_deduct = 14;
  erposfnb.common.MeasureType weight_unit = 15;
  double dimension_x = 16;
  double dimension_y = 17;
  double dimension_z = 18;
  erposfnb.common.LengthType dimension_unit = 19;
}

// Item is a sellable menu row of one tenant branch.
message Item {
  string id = 1;
  string tenant_id = 2;
  string tenant_id_branch = 3;
  string name = 4;
  bool use_sync_stock = 5;
  string thumbnail = 6;
  string description = 7;
  string category = 8;
  repeated string tags = 9;
  bool out_of_order = 10;
  double price = 11;
  erposfnb.common.Currency currency = 12;
  double weight = 13;
  erposfnb.common.MeasureType weight_unit = 14;
  double dimension_x = 15;
  double dimension_y = 16;
  double dimension_z = 17;
  erposfnb.common.LengthType dimension_unit = 18;
}

// Order is one customer order of a tenant branch.
message Order {
  string id = 1;
  string tenant_id = 2;
  string tenant_id_branch = 3;
  OrderType type = 4;
  OrderStatus status = 5;
  string customer_name = 6;
  string customer_phone = 7;
  string customer_email = 8;
  google.protobuf.Timestamp order_created = 9;
  google.protobuf.Timestamp last_updated = 10;
}

// OrderItem is one item line of an order.
// price_at_order and currency_at_order keep the value at order time.
message OrderItem {
  string id = 1;
  string id_order = 2;
  string id_item = 3;
  int64 quantity = 4;
  double price_at_order = 5;
  erposfnb.common.Currency currency_at_order = 6;
  double weight = 7;
  erposfnb.common.MeasureType weight_unit = 8;
}

// OrderTax is a tax definition of one tenant branch.
message OrderTax {
  string id = 1;
  string tenant_id = 2;
  string tenant_id_branch = 3;
  string name = 4;
  double percentage = 5;
}

// OrderTaxLine is a tax snapshot taken when the order is created.
message OrderTaxLine {
  string id = 1;
  string id_order = 2;
  string id_tax = 3;
  string name_snapshot = 4;
  double percentage_snapshot = 5;
}

// OrderPayment is the single settlement row of an order.
message OrderPayment {
  string id_order = 1;
  double total = 2;
  erposfnb.common.Currency currency = 3;
  PaymentStatus status = 4;
  PaymentMethod method = 5;
}

// StockRequest is a stock request row of one tenant branch.
message StockRequest {
  string id = 1;
  string tenant_id = 2;
  string tenant_id_branch = 3;
  string id_stock_local = 4;
  string id_stock_warehouse = 5;
  string name = 6;
  int64 quantity = 7;
  double weight = 8;
  erposfnb.common.MeasureType weight_unit = 9;
  double dimension_x = 10;
  double dimension_y = 11;
  double dimension_z = 12;
  erposfnb.common.LengthType dimension_unit = 13;
  string note = 14;
  erposfnb.common.StockRequestStatus status = 15;
  string request_by = 16;
  google.protobuf.Timestamp request_at = 17;
  string approved_by = 18;
  google.protobuf.Timestamp approved_at = 19;
  string received_by = 20;
  google.protobuf.Timestamp received_at = 21;
}

message ListStocksRequest {
  string tenant_id = 1;
  string tenant_id_branch = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message ListStocksResponse {
  repeated Stock stocks = 1;
  uint64 total = 2;
}

message CreateStockRequest {
  Stock stock = 1;
}

message CreateStockResponse {
  Stock stock = 1;
}

message GetStockRequest {
  string id = 1;
}

message GetStockResponse {
  Stock stock = 1;
}

message UpdateStockRequest {
  Stock stock = 1;
}

message UpdateStockResponse {
  Stock stock = 1;
}

message DeleteStockRequest {
  string id = 1;
}

message DeleteStockResponse {
  bool deleted = 1;
}

message ListItemsRequest {
  string tenant_id = 1;
  string tenant_id_branch = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message ListItemsResponse {
  repeated Item items = 1;
  uint64 total = 2;
}

message CreateItemRequest {
  Item item = 1;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  string id = 1;
}

message GetItemResponse {
  Item item = 1;
}

message UpdateItemRequest {
  Item item = 1;
}

message UpdateItemResponse {
  Item item = 1;
}

message DeleteItemRequest {
  string id = 1;
}

message DeleteItemResponse {
  bool deleted = 1;
}

message ListOrdersRequest {
  string tenant_id = 1;
  string tenant_id_branch = 2;
  OrderStatus status = 3;
  uint32 page = 4;
  uint32 page_size = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  uint64 total = 2;
}

// CreateOrderRequest carries the order, its item lines, and the tax snapshot.
// The caller supplies an idempotency key so a retry makes no second order.
message CreateOrderRequest {
  Order order = 1;
  repeated OrderItem items = 2;
  repeated OrderTaxLine tax_lines = 3;
  string idempotency_key = 4;
}

message CreateOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  Order order = 1;
  repeated OrderItem items = 2;
  OrderPayment payment = 3;
}

message UpdateOrderStatusRequest {
  string id = 1;
  OrderStatus status = 2;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message CreatePaymentRequest {
  string id_order = 1;
  double total = 2;
  erposfnb.common.Currency currency = 3;
  PaymentMethod method = 4;
  string idempotency_key = 5;
}

message CreatePaymentResponse {
  OrderPayment payment = 1;
}

message GetPaymentRequest {
  string id_order = 1;
}

message GetPaymentResponse {
  OrderPayment payment = 1;
}

message ListStockRequestsRequest {
  string tenant_id = 1;
  string tenant_id_branch = 2;
  erposfnb.common.StockRequestStatus status = 3;
}

message ListStockRequestsResponse {
  repeated StockRequest stock_requests = 1;
}

message CreateStockRequestLocalRequest {
  StockRequest stock_request = 1;
  string idempotency_key = 2;
}

message CreateStockRequestLocalResponse {
  StockRequest stock_request = 1;
}

message GetStockRequestDetailRequest {
  string id = 1;
}

message GetStockRequestDetailResponse {
  StockRequest stock_request = 1;
}

// ReceiveStockRequestRequest marks a shipped request as received.
// The handler adds the quantity to local stock and writes the stock log row.
message ReceiveStockRequestRequest {
  string id = 1;
  string id_stock_local = 2;
  string received_by = 3;
}

message ReceiveStockRequestResponse {
  StockRequest stock_request = 1;
}

// StockRequestApprovedRequest is called by warehouse after it approves a request.
message StockRequestApprovedRequest {
  string id_stock_request = 1;
  string id_stock_warehouse = 2;
  string approved_by = 3;
}

message StockRequestApprovedResponse {
  StockRequest stock_request = 1;
}

// StockRequestShippedRequest is called by warehouse after it ships a request.
message StockRequestShippedRequest {
  string id_stock_request = 1;
  string id_stock_warehouse = 2;
}

message StockRequestShippedResponse {
  StockRequest stock_request = 1;
}

// PosService serves stock, item, order, payment, and stock request work.
// It is a private core service and is never called by a frontend directly.
service PosService {
  rpc ListStocks(ListStocksRequest) returns (ListStocksResponse);
  rpc CreateStock(CreateStockRequest) returns (CreateStockResponse);
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);
  rpc DeleteStock(DeleteStockRequest) returns (DeleteStockResponse);
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc UpdateItem(UpdateItemRequest) returns (UpdateItemResponse);
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ListStockRequests(ListStockRequestsRequest) returns (ListStockRequestsResponse);
  rpc CreateStockRequestLocal(CreateStockRequestLocalRequest) returns (CreateStockRequestLocalResponse);
  rpc GetStockRequestDetail(GetStockRequestDetailRequest) returns (GetStockRequestDetailResponse);
  rpc ReceiveStockRequest(ReceiveStockRequestRequest) returns (ReceiveStockRequestResponse);
  rpc StockRequestApproved(StockRequestApprovedRequest) returns (StockRequestApprovedResponse);
  rpc StockRequestShipped(StockRequestShippedRequest) returns (StockRequestShippedResponse);
}
