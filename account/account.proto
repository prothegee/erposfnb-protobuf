syntax = "proto3";

package erposfnb.account;

option go_package = "github.com/prothegee/erposfnb-protobuf/account";

// Account is the identity row that a user signs in with.
message Account {
  string id = 1;
  string id_ref = 2;
  string email = 3;
  string username = 4;
  bool banned = 5;
  string banned_reason = 6;
}

// Information is the profile row that belongs to one account.
message Information {
  string id_user = 1;
  string first_name = 2;
  string middle_name = 3;
  string last_name = 4;
  string pub_path = 5;
  string pub_pict = 6;
}

message SignUpRequest {
  string email = 1;
  string username = 2;
  string password = 3;
}

message SignUpResponse {
  Account account = 1;
}

// SignInRequest accepts either an email or a username in identifier.
message SignInRequest {
  string identifier = 1;
  string password = 2;
}

message SignInResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message SignOutRequest {
  string refresh_token = 1;
  string jti = 2;
}

message SignOutResponse {
  bool revoked = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

// CheckBlocklistRequest carries the access token jti that gateway must test.
message CheckBlocklistRequest {
  string jti = 1;
}

message CheckBlocklistResponse {
  bool revoked = 1;
}

message GetMeRequest {
}

message GetMeResponse {
  Account account = 1;
}

message UpdateMeRequest {
  string email = 1;
  string username = 2;
}

message UpdateMeResponse {
  Account account = 1;
}

message UpdatePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message UpdatePasswordResponse {
  bool updated = 1;
}

message GetInformationRequest {
  string id_user = 1;
}

message GetInformationResponse {
  Information information = 1;
}

message UpdateInformationRequest {
  Information information = 1;
}

message UpdateInformationResponse {
  Information information = 1;
}

// AccountService serves session and profile work for the internal callers.
// Account owns the JWT key pair and never stores an access token.
service AccountService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc CheckBlocklist(CheckBlocklistRequest) returns (CheckBlocklistResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse);
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
  rpc GetInformation(GetInformationRequest) returns (GetInformationResponse);
  rpc UpdateInformation(UpdateInformationRequest) returns (UpdateInformationResponse);
}
